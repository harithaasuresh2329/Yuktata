<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yuktata - AI Legal Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --navy: #1a3a52;
            --navy-dark: #0f1f2e;
            --beige: #f5f1ed;
            --cream: #faf8f5;
            --gold: #b8956a;
            --text-dark: #2c2c2c;
            --text-light: #6b6b6b;
            --border: #e8e4df;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background-color: var(--beige);
            color: var(--text-dark);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: linear-gradient(135deg, var(--beige) 0%, #f9f6f3 100%);
        }

        /* Header */
        .header {
            background-color: var(--navy);
            color: white;
            padding: 1.5rem 2rem;
            text-align: center;
            border-bottom: 3px solid var(--gold);
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 0.3rem;
        }

        .header p {
            font-size: 0.9rem;
            opacity: 0.95;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
            background-color: var(--beige);
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: var(--gold);
            border-radius: 4px;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: var(--text-light);
        }

        .empty-state h2 {
            font-size: 1.5rem;
            color: var(--navy);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .empty-state p {
            font-size: 0.95rem;
            line-height: 1.6;
            max-width: 400px;
            color: var(--text-light);
        }

        /* Messages */
        .message {
            display: flex;
            gap: 1rem;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 75%;
            padding: 1rem 1.2rem;
            border-radius: 8px;
            line-height: 1.5;
        }

        .message.user .message-content {
            background-color: var(--navy);
            color: white;
            border-radius: 12px 2px 12px 12px;
            font-size: 0.95rem;
        }

        .message.assistant .message-content {
            background-color: var(--cream);
            border: 1px solid var(--border);
            border-radius: 2px 12px 12px 12px;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        .response-section {
            margin-bottom: 1rem;
        }

        .response-label {
            font-weight: 700;
            color: var(--navy);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.4rem;
        }

        .response-text {
            line-height: 1.6;
            color: var(--text-dark);
        }

        .sources {
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(26, 58, 82, 0.1);
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .sources strong {
            color: var(--navy);
            display: block;
            margin-bottom: 0.3rem;
        }

        .error-message {
            background-color: #fce4e4;
            color: #c41e3a;
            padding: 1rem;
            border-radius: 6px;
            border-left: 4px solid #c41e3a;
            font-size: 0.95rem;
        }

        .success-message {
            background-color: #e4fcf1;
            color: #1e7c41;
            padding: 1rem;
            border-radius: 6px;
            border-left: 4px solid #1e7c41;
            font-size: 0.95rem;
        }

        /* Input Area */
        .input-area {
            background-color: var(--navy);
            padding: 1.5rem 2rem;
            border-top: 3px solid var(--gold);
        }

        .input-wrapper {
            display: flex;
            gap: 0.8rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }

        .input-box {
            flex: 1;
            padding: 1rem;
            border: 1px solid var(--gold);
            border-radius: 6px;
            font-size: 0.95rem;
            background-color: var(--cream);
            color: var(--text-dark);
            font-family: inherit;
            transition: all 0.2s;
        }

        .input-box:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(184, 149, 106, 0.1);
        }

        .input-box::placeholder {
            color: var(--text-light);
        }

        .send-btn {
            padding: 1rem 1.5rem;
            background-color: var(--gold);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .send-btn:hover {
            background-color: #a0854f;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(184, 149, 106, 0.3);
        }

        .send-btn:active {
            transform: translateY(0);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Disclaimer */
        .disclaimer {
            background-color: rgba(26, 58, 82, 0.05);
            border-top: 1px solid var(--border);
            padding: 1rem 2rem;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-light);
            line-height: 1.5;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .loading-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--text-light);
            animation: bounce 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                opacity: 0.5;
                transform: translateY(0);
            }
            40% {
                opacity: 1;
                transform: translateY(-6px);
            }
        }

        .connection-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            padding: 0.5rem 1rem;
            background-color: rgba(26, 58, 82, 0.1);
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-dot.connected {
            background-color: #1e7c41;
            animation: none;
        }

        .status-dot.disconnected {
            background-color: #c41e3a;
            animation: none;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.4rem;
            }

            .message-content {
                max-width: 90%;
                font-size: 0.9rem;
            }

            .input-wrapper {
                flex-direction: column;
            }

            .input-area {
                padding: 1rem;
            }

            .header {
                padding: 1rem;
            }

            .chat-container {
                padding: 1rem;
            }

            .input-box {
                padding: 0.8rem;
            }

            .send-btn {
                padding: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>YUKTATA</h1>
            <p>Indian Legal AI Assistant</p>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="empty-state">
                <h2>Know Your Rights.</h2>
                <p>Understand Indian law with clear, concise answers to your constitutional and legal questions.</p>
            </div>
        </div>

        <div class="input-area">
            <div class="connection-status">
                <div class="status-dot connected" id="statusDot"></div>
                <span id="statusText">Connected</span>
            </div>
            <div class="input-wrapper">
                <input
                    type="text"
                    class="input-box"
                    id="userInput"
                    placeholder="Ask a question about Indian law..."
                    autocomplete="off"
                />
                <button class="send-btn" id="sendBtn">Ask</button>
            </div>
        </div>

        <div class="disclaimer">
            Yuktata provides legal information for educational purposes and does not replace advice from a qualified legal professional.
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        let isLoading = false;
        let serverConnected = true;

        // Check server connection on load
        window.addEventListener('load', async () => {
            try {
                const response = await fetch('/api/health');
                if (response.ok) {
                    serverConnected = true;
                    statusDot.className = 'status-dot connected';
                    statusText.textContent = 'Connected';
                }
            } catch (error) {
                serverConnected = false;
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = 'Disconnected';
                addMessage('<div class="error-message">Error: Cannot connect to server. Please ensure the backend server is running on http://localhost:5000</div>', 'assistant', true);
            }
        });

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !isLoading) {
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message || isLoading) return;

            if (!serverConnected) {
                addMessage('<div class="error-message">Error: Server is not connected. Please start the backend server on http://localhost:5000</div>', 'assistant', true);
                return;
            }

            isLoading = true;
            sendBtn.disabled = true;

            // Remove empty state if this is the first message
            const emptyState = chatContainer.querySelector('.empty-state');
            if (emptyState) {
                emptyState.remove();
            }

            // Add user message
            addMessage(message, 'user');
            userInput.value = '';

            // Show loading
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message assistant';
            loadingDiv.innerHTML = `<div class="message-content"><div class="loading"><div class="loading-dot"></div><div class="loading-dot"></div><div class="loading-dot"></div></div></div>`;
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ message }),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Server error: ${response.status}`);
                }

                const data = await response.json();
                loadingDiv.remove();
                
                if (data.response) {
                    addMessage(formatResponse(data.response), 'assistant', true);
                } else {
                    addMessage('<div class="error-message">Error: No response received</div>', 'assistant', true);
                }

                serverConnected = true;
                statusDot.className = 'status-dot connected';
                statusText.textContent = 'Connected';

            } catch (error) {
                loadingDiv.remove();
                serverConnected = false;
                statusDot.className = 'status-dot disconnected';
                statusText.textContent = 'Disconnected';
                
                let errorMsg = error.message;
                if (errorMsg.includes('fetch')) {
                    errorMsg = 'Server connection failed. Ensure backend is running on http://localhost:5000';
                }
                addMessage(
                    `<div class="error-message">Error: ${errorMsg}</div>`,
                    'assistant',
                    true
                );
            }

            isLoading = false;
            sendBtn.disabled = false;
            userInput.focus();
        }

        function addMessage(content, sender, isHTML = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}`;

            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            
            if (isHTML) {
                contentDiv.innerHTML = content;
            } else {
                contentDiv.textContent = content;
            }

            messageDiv.appendChild(contentDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function formatResponse(text) {
            // Clean up the text and remove markdown
            text = cleanMarkdown(text.trim());

            // Parse the response into sections
            const directAnswerRegex = /DIRECT\s+ANSWER[\s]*[\n]+([\s\S]*?)(?=[\n]+BRIEF\s+EXPLANATION|$)/i;
            const briefRegex = /BRIEF\s+EXPLANATION[\s]*[\n]+([\s\S]*?)(?=[\n]+SOURCES|$)/i;
            const sourcesRegex = /SOURCES[\s]*[\n]+([\s\S]*?)$/i;

            const directMatch = text.match(directAnswerRegex);
            const briefMatch = text.match(briefRegex);
            const sourcesMatch = text.match(sourcesRegex);

            let html = '';

            if (directMatch && directMatch[1]) {
                const content = cleanMarkdown(directMatch[1].trim());
                html += `<div class="response-section">
                    <div class="response-label">Direct Answer</div>
                    <div class="response-text">${escapeHtml(content)}</div>
                </div>`;
            }

            if (briefMatch && briefMatch[1]) {
                const content = cleanMarkdown(briefMatch[1].trim());
                html += `<div class="response-section">
                    <div class="response-label">Brief Explanation</div>
                    <div class="response-text">${escapeHtml(content)}</div>
                </div>`;
            }

            if (sourcesMatch && sourcesMatch[1]) {
                const content = cleanMarkdown(sourcesMatch[1].trim());
                html += `<div class="sources">
                    <strong>Sources:</strong>
                    <div>${escapeHtml(content)}</div>
                </div>`;
            }

            // Fallback
            if (!directMatch && !briefMatch && !sourcesMatch) {
                html = `<div class="response-text">${escapeHtml(cleanMarkdown(text))}</div>`;
            }

            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            let escaped = div.innerHTML;
            escaped = escaped.replace(/\n/g, '<br>');
            escaped = escaped.replace(/\*\*/g, '');
            escaped = escaped.replace(/\*/g, '');
            escaped = escaped.replace(/__/g, '');
            return escaped;
        }

        function cleanMarkdown(text) {
            text = text.replace(/\*\*/g, '');
            text = text.replace(/\*/g, '');
            text = text.replace(/__/g, '');
            text = text.replace(/`/g, '');
            text = text.replace(/^\s*[-*+]\s/gm, '');
            return text;
        }
    </script>
</body>
</html>
